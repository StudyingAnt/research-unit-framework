name: Verify and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic creation, Coordination, IDs, reports and updates
        run: python -B -m unittest discover -s tests -v
      - name: Public candidate audit
        run: python -B tools/audit_public.py
      - name: Package the visible template and test archive-only creation
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/package_release.py
          destination="$(mktemp -d)"
          tar -xzf "dist/research-program-framework-$(cat VERSION).tar.gz" -C "$destination"
          python -B "$destination/research-program-framework-$(cat VERSION)/tools/newproj.py" synthetic --destination "$destination/synthetic"
          python -B "$destination/synthetic/tools/new_unit.py" 'Synthetic archive task' --approved-by 'Synthetic CI allocation approval'

  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package validated tagged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python -B tools/package_release.py
      - name: Publish a new release without replacing earlier tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release already exists; stop and inspect.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}.tar.gz" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            --verify-tag --title "Research Program Framework ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md
