name: Verify and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/development.txt
      - name: Synthetic safety and archive acceptance
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -q
      - name: Public source audit
        env:
          PYTHONPATH: src
        run: python -B -m research_program_framework audit-public

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and build from clean tagged source
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python -B -m research_program_framework build-release "dist/research-program-framework-${GITHUB_REF_NAME#v}" --require-clean
          python -B -m research_program_framework audit-public --archive "dist/research-program-framework-${GITHUB_REF_NAME#v}.tar.gz"
          cd dist
          sha256sum "research-program-framework-${GITHUB_REF_NAME#v}.tar.gz" > "research-program-framework-${GITHUB_REF_NAME#v}.tar.gz.sha256"
      - name: Publish new immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before any attempted republish.' >&2
            exit 1
          fi
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then extra=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}.tar.gz" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}/newproj.pyz" \
            "dist/research-program-framework-${GITHUB_REF_NAME#v}/SHA256SUMS" \
            --verify-tag --title "Research Program Framework ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md "${extra[@]}"
